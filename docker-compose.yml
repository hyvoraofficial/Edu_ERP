# ==========================================
# HYVORA EduERP - Production Docker Compose
# ==========================================

services:
  # ----------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: hyvora-postgres
    restart: always
    environment:
      POSTGRES_DB: hyvora_eduerp
      POSTGRES_USER: hyvora_user
      POSTGRES_PASSWORD: hyvora_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyvora_user -d hyvora_eduerp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # NestJS Backend API Service
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyvora-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://hyvora_user:hyvora_secure_pass@postgres:5432/hyvora_eduerp?schema=public
      JWT_SECRET: production_super_secret_jwt_key_hyvora_eduerp
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,https://*.hyvora.io
      STORAGE_BUCKET_URL: https://storage.hyvora.io
      STORAGE_BUCKET_NAME: hyvora-erp-storage
      ENABLE_SWAGGER: "true"
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------
  # Next.js Frontend Web Application Service
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
    container_name: hyvora-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

# ----------------------------------------
# Persistent Storage Volumes
# ----------------------------------------
volumes:
  postgres_data:
    driver: local
